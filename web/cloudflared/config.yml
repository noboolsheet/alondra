# Cloudflare Tunnel — locally managed. Este archivo SÍ se versiona (no es secreto).
#
# En servicio: el conector corre en vibox y sirve alondrama.com (apex + www).
#
# MUDANZA DE SERVIDOR O DE REPO: el túnel NO hay que rehacerlo. Su identidad son
# tres cosas, y ninguna depende de dónde viva el repositorio:
#   1. el UUID de abajo, registrado en tu cuenta de Cloudflare;
#   2. ./credentials.json, el secreto que autentica al conector (gitignored, NO
#      viaja por git: cópialo a mano de la máquina vieja a la nueva);
#   3. los CNAME en Cloudflare DNS, que ya apuntan a <UUID>.cfargotunnel.com.
#
# ⚠ NO dejes el conector corriendo en dos máquinas a la vez: Cloudflare admite
# varias réplicas del mismo túnel y reparte el tráfico entre ellas, así que unas
# visitas irían a una máquina y otras a la otra. Apaga el viejo (./tunnel.sh down)
# antes de levantar el nuevo.
#
# Las credenciales se copian a ./cloudflared/credentials.json (gitignored) y se
# montan en el contenedor en /etc/cloudflared/credentials.json.

tunnel: ad94d197-ed17-4426-a2f8-52cad1fa3e4c
credentials-file: /etc/cloudflared/credentials.json

# Reglas de enrutamiento (se evalúan en orden). El catch-all 404 final es obligatorio.
ingress:
  - hostname: alondrama.com
    service: http://alondra.app.prod:3000
  - hostname: www.alondrama.com
    service: http://alondra.app.prod:3000
  - service: http_status:404

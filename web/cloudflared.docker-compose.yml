name: stack-site-alondra-tunnel

# Cloudflare Tunnel (LOCALLY-MANAGED) para exponer alondra en internet sin IP
# publica ni port-forwarding. El conector corre en vibox, se une a la red
# externa compartida del servidor (noboolsheet_network) y enruta el dominio ->
# este tunel -> http://alondra.app.prod:3000 segun ./cloudflared/config.yml.
#
# La config y las credenciales se montan desde ./cloudflared:
#   - config.yml         (versionado; NO secreto)
#   - credentials.json   (gitignored; SECRETO, lo genera `cloudflared tunnel create`)
#
# Requisitos:
#   - Sitio ya arriba:  ./deploy-alondra.sh prod  (crea la red compartida y el
#     contenedor alondra.app.prod).
#   - Setup del tunel hecho (login/create/route dns) — ver README.
#
# Arranque:  ./tunnel.sh up
services:
  cloudflared:
    # Fijado por digest: `:latest` hacia que dos despliegues pudieran traer
    # conectores distintos. Para subir de version, `./tunnel.sh update` dice el
    # digest nuevo y esta es la unica linea que hay que cambiar (ver SECURITY.md).
    image: cloudflare/cloudflared:latest@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    container_name: alondra.cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml --no-autoupdate run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    networks:
      - custom_net_ref

networks:
  custom_net_ref:
    name: noboolsheet_network   # red compartida del servidor
    external: true
